name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Dependencies
        run: python3 -m pip install --quiet pyyaml tiktoken
      - name: Repository validation
        run: python3 scripts/validate-repository.py
      - name: External dependency provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/external-dependencies.py verify-source
      - name: Repo script tests
        run: python3 -m unittest discover -s scripts/tests
      - name: architecture-intelligence plugin tests
        run: python3 -m unittest discover -s plugins/architecture-intelligence/tests
      - name: design-intelligence plugin tests
        run: python3 -m unittest discover -s plugins/design-intelligence/tests
      - name: kotlin-multiplatform plugin tests
        run: python3 -m unittest discover -s plugins/kotlin-multiplatform/tests
      - name: context-density plugin tests
        run: python3 -m unittest discover -s plugins/context-density/tests
      - name: agent-harness plugin tests
        run: python3 -m unittest discover -s plugins/agent-harness/tests
      - name: git-workflows plugin tests
        run: python3 -m unittest discover -s plugins/git-workflows/tests
      - name: technology-intelligence plugin tests
        run: |
          python3 plugins/technology-intelligence/scripts/technology_intelligence.py validate
          python3 -m unittest discover -s plugins/technology-intelligence/tests
      - name: capability-workbench plugin tests
        run: |
          python3 plugins/capability-workbench/tests/run_smoke.py
          python3 -m unittest discover -s plugins/capability-workbench/tests
      - name: Install dry-runs
        run: |
          python3 scripts/install-codex-plugins.py --dry-run
          python3 scripts/install-cursor-skills.py --dry-run --dest /tmp/cursor-preview
      - name: README token-table drift
        run: python3 scripts/token-report.py --check
